name: Build WhatGram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create dummy google-services.json
        run: |
          echo '{"project_info":{"project_number":"1234567890","project_id":"whatgram","storage_bucket":"://appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.whatgram.messenger"}},"api_key":[{"current_key":"AIzaSyDummyKeyForBuild1234567890"}]}],"configuration_version":"1"}' > TMessagesProj_App/google-services.json
          cp TMessagesProj_App/google-services.json TMessagesProj/google-services.json || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :TMessagesProj_App:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatGram-apk
          path: "**/build/outputs/apk/**/*.apk"
